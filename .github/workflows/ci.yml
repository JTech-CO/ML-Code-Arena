name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 손으로 다시 돌릴 수 있어야 한다. 인프라 문제로 빨개진 실행을 재현하거나,
  # 코드 변경 없이 게이트만 확인할 때 필요하다.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: build / typecheck / lint / test
    runs-on: ubuntu-latest

    # 저장소를 진짜로 띄운다. 없으면 API 테스트가 `storesAvailable()` 에서 조용히
    # 건너뛰고, "통과했다"와 "돌지 않았다"가 구분되지 않는다.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mlca
          POSTGRES_PASSWORD: mlca_ci
          POSTGRES_DB: mlca
        options: >-
          --health-cmd "pg_isready -U mlca -d mlca"
          --health-interval 5s --health-timeout 5s --health-retries 20
        ports: ['5432:5432']
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
        ports: ['6379:6379']

    env:
      DATABASE_URL: postgres://mlca:mlca_ci@127.0.0.1:5432/mlca
      REDIS_URL: redis://127.0.0.1:6379

    steps:
      - uses: actions/checkout@v4

      - name: pnpm 설치
        uses: pnpm/action-setup@v4

      # docs/ENVIRONMENT.md §1 — Node 22 LTS 고정.
      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint

      # 테스트는 `_test` 접미사 DB 를 쓴다. `pnpm test` 가 준비를 먼저 부른다.
      # 이름이 `_test` 로 끝나지 않으면 테스트가 거부한다 (apps/api/test/helpers.js).
      - run: pnpm test

      # 저장소가 정말 붙었는지 확인한다. 위 테스트가 skip 으로 초록이 되는 경우를 막는다.
      - name: API 테스트가 건너뛰지 않았는지 확인
        run: |
          psql "$DATABASE_URL" -c "SELECT 1" >/dev/null
          test "$(psql "${DATABASE_URL}_test" -tAc "SELECT count(*) FROM _migrations")" -ge 5

      # 경계 룰이 "설정되어 있다"가 아니라 "실제로 막는다"를 확인한다 (INV-3).
      - name: 모듈 경계 실효 검증
        run: pnpm check:boundaries

      # INV-12 — 라이트·다크 전 조합의 텍스트 대비. 눈으로 보면 다크에서 한 토큰이
      # 기준 아래로 떨어져도 라이트가 멀쩡해서 아무도 모른다.
      - name: 토큰 대비 검사
        run: pnpm check:contrast

      # DESIGN.md §12 금지 목록 + 색 리터럴이 tokens.css 밖에 있는지.
      - name: 디자인 린트
        run: pnpm check:design

      # 문제집 정합성 — 단계 분포·제한 누락·개념 링크. Docker 없이 도는 검사다.
      - name: 문제 정의 점검
        run: pnpm problems:report

      # INV-1 — 시크릿이 무시 대상인지, 서식 파일에 값이 들어가지 않았는지.
      - name: 시크릿 제외 확인
        run: |
          git check-ignore -q .env
          git check-ignore -q problems/0001-broadcast-shape/cases/manifest.json
          git check-ignore -q backup

          # 서식 파일의 **시크릿 항목**은 비어 있어야 한다. 한 번 채워 넣고 커밋하면
          # 그 뒤로는 아무도 다시 보지 않는다.
          #
          # 모든 키가 아니라 시크릿을 담는 키만 본다. "전부 비어 있어야 한다"로 두면
          # `JUDGE_IMAGE` 같은 무해한 기본값을 넣을 때마다 예외 목록이 늘고, 늘어난
          # 예외 목록은 언젠가 진짜 시크릿을 덮는다.
          if grep -nE '^(SESSION_SECRET|IP_HASH_SECRET|POSTGRES_PASSWORD|DATABASE_URL|ALERT_WEBHOOK_URL)=.+$' \
               .env.example deploy/env.production.example; then
            echo "INV-1: 서식 파일의 시크릿 항목에 값이 들어 있다"
            exit 1
          fi

      # INV-7 — 안전하지 않은 직렬화를 "활성화"하는 코드가 없는지.
      # 존재가 아니라 활성화를 본다. `allow_pickle=False` 는 위반이 아니라 집행 지점이다.
      - name: 직렬화 정책 확인
        run: |
          if git grep -n -i -E 'allow_pickle\s*=\s*True|^\s*import\s+pickle\b|^\s*from\s+pickle\s+import\b|\.pkl\b' -- judge/; then
            echo "INV-7 위반: 안전하지 않은 직렬화를 켜는 코드가 있다"
            exit 1
          fi

  judge:
    name: 격리 게이트 + 문제집 (Docker)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: pnpm 설치
        uses: pnpm/action-setup@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 채점 이미지 빌드
        run: pnpm judge:image

      # M1 게이트 — 판정 8종 재현 + 격리 불변식(INV-4·5·6·8) + 커널 상태 확인.
      # 이 게이트가 없으면 격리가 풀린 커밋이 그냥 머지된다.
      - name: 격리 게이트
        run: pnpm judge:fixtures

      # M6 게이트 — 기대값 재현(INV-10)과 문제 30개의 양방향 성립.
      - name: 기대값 재현 검증
        run: pnpm problems:verify

      - name: 기준 구현 30/30 AC
        run: pnpm judge:batch -- --source reference

      # 이 플랫폼의 존재 이유. 제한이 실제로 우회를 막는지 본다 (ADR-0002).
      - name: 우회 샘플 30/30 FBD
        run: pnpm judge:batch -- --source bypass

  deploy-config:
    name: 배포 설정 검증
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # compose 파일이 문법적으로 맞는지. 배포 중에 발견하면 이미 늦다.
      - name: compose 문법
        run: |
          set -a && . deploy/env.production.example && set +a
          # 서식의 빈 값이 보간 경고를 내지만, 여기서 보는 것은 문법이다.
          docker compose -f deploy/compose.yml config --quiet

      - name: Caddyfile 문법
        run: |
          docker run --rm -v "$PWD/deploy/Caddyfile:/Caddyfile:ro" caddy:2-alpine \
            caddy validate --config /Caddyfile --adapter caddyfile

      - name: systemd 유닛 문법
        run: |
          sudo systemd-analyze verify deploy/mlca-worker.service 2>&1 | tee /tmp/unit.log || true
          # docker·node 실행 파일 부재는 러너 환경 탓이므로 통과시킨다.
          # 알 수 없는 지시어(오타)는 통과시키지 않는다 — 그건 유닛이 조용히
          # 덜 잠긴 채로 도는 원인이 된다.
          if grep -qiE 'Unknown (key|lvalue|section)' /tmp/unit.log; then
            echo "systemd 유닛에 알 수 없는 지시어가 있다"
            exit 1
          fi
