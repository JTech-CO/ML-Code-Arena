<!doctype html>
<html lang="ko" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ML Code Arena</title>
    <meta
      name="description"
      content="AI·머신러닝 알고리즘을 라이브러리 없이 직접 구현하는 온라인 저지"
    />

    <!--
      FOUC 방지 — CSS·번들보다 **먼저** 실행되어야 한다 (docs/DESIGN.md §8.2).
      이 스크립트가 뒤로 밀리면 다크 사용자가 매 새로고침마다 흰 화면 깜빡임을 본다
      (RUNBOOK 30번). 그래서 외부 파일이 아니라 인라인이고, 위치도 <head> 최상단이다.

      `prefers-color-scheme` 를 읽지 않는다. 저장값이 있을 때만 다크로 간다 (ADR-0006) —
      OS 설정을 따르면 "기본은 라이트"라는 요구가 무의미해진다.
    -->
    <script>
      try {
        if (localStorage.getItem('mlca-theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark';
        }
      } catch (e) {
        /* 프라이빗 모드 등에서 localStorage 접근이 막히면 기본값(라이트)으로 둔다. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
