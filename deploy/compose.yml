# 운영 스택 — caddy · api · postgres · redis.
#
# **워커는 여기 없다.** Docker 소켓이 필요해 호스트 프로세스로 돈다 (ADR-0007,
# deploy/README.md). 그래서 postgres·redis 포트를 호스트로 낸다 — 워커가 호스트에서
# 붙어야 하기 때문이다. 다만 `127.0.0.1` 에만 묶어 바깥에서는 닿지 않는다.
#
# 개발용 `docker-compose.yml`(저장소 루트)과 별개 파일이다. 개발 파일은 계정·비밀번호가
# 박혀 있고 포트를 넓게 연다. 하나로 합치면 언젠가 개발 기본값이 운영으로 샌다.
#
# **반드시 `--env-file .env` 와 함께 부른다** (docs/ENVIRONMENT.md §7.3):
#
#     docker compose --env-file .env -f deploy/compose.yml up -d --build
#
# compose 의 `${...}` 보간은 **compose 파일이 있는 디렉터리**의 `.env` 를 읽는다.
# 우리 `.env` 는 저장소 루트에 있으므로 그냥 `-f deploy/compose.yml` 만 주면
# `POSTGRES_PASSWORD` 가 빈 값이 되고 Postgres 가 기동을 거부한다. 실제로 M7 에서
# 문서대로 따라 하다가 이 지점에서 멈췄다.

name: mlca

services:
  caddy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    image: mlca-web:${MLCA_TAG:-latest}
    restart: unless-stopped
    # `env_file` 로 `.env` 를 통째로 주지 않는다. 프록시는 사이트 주소만 알면 되고,
    # DB 비밀번호를 알 이유가 없다. 필요 없는 곳에 시크릿을 두지 않는다.
    environment:
      MLCA_SITE_ADDRESS: ${MLCA_SITE_ADDRESS:-http://localhost}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    logging: &logging
      driver: json-file
      options:
        # 시간 기준 보존은 도커 드라이버에 없다. 크기로 근사하고, 실제 보존 기간은
        # `tools/ops-metrics.js` 가 찍는 유입량으로 조정한다 (docs/TECHNICAL.md §13.1).
        max-size: '20m'
        max-file: '10'

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    image: mlca-api:${MLCA_TAG:-latest}
    restart: unless-stopped
    env_file: [../.env]
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: '3000'
      # 컨테이너에서 본 의존 서비스 주소. `.env` 의 값(호스트 기준)을 덮어쓴다 —
      # 같은 `.env` 를 호스트의 워커와 컨테이너의 api 가 함께 쓰기 때문이다.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
    # 호스트로 포트를 내지 않는다. caddy 만 compose 네트워크로 닿는다.
    expose: ['3000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    # 사용자 코드를 실행하지 않는 프로세스다. 권한을 더 줄 이유가 없다.
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=16m']
    logging: *logging

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # 워커가 호스트 프로세스라 붙을 수 있어야 한다. 루프백에만 묶는다.
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'psql -U $$POSTGRES_USER -d $$POSTGRES_DB -c "select 1" || exit 1']
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # BullMQ 가 키를 직접 관리한다. evict 되면 작업이 조용히 사라지므로 noeviction 이다.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
