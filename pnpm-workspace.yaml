# NOTE: keep this file ASCII-only. pnpm rewrites it (e.g. `pnpm approve-builds`)
# and mangles non-ASCII comments on Windows. Korean notes live in README.md instead.
#
# judge/ is Python and is intentionally outside the JS workspace (docs/FILE_TREE.md 1).
# tools/ is dev-only CLI, run from the root devDependencies.

packages:
  - 'apps/*'
  - 'packages/*'

# pnpm >=10 blocks dependency install scripts by default.
# Every entry here is a deliberate decision, not a way to silence a warning.
allowBuilds:
  # vite needs esbuild's install script.
  esbuild: true
  # Optional native accelerator for msgpackr (bullmq job serialization).
  # msgpackr falls back to pure JS without it, and Phase 1 throughput
  # (~2800 judgements/hour) does not need it. Denied rather than allowed:
  # a native build script we do not need is attack surface we do not need.
  msgpackr-extract: false
